<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhận xét học sinh lớp 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Baloo+2:wght@600;700&display=swap">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#172033;--mute:#667085;--line:#E3E7EF;--soft:#F7F8FB;--pri:#1F2A44;--priD:#2F3D63;--priL:#E9EDF4;--T:#0E9F6E;--H:#E8A100;--C:#E5484D;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #7C8FBF;outline-offset:2px}
svg.i{display:block;flex:none}
[hidden]{display:none!important}
.grp{display:inline-flex;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff}
.gb{position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:0;background:none;font-size:14px;font-weight:500;transition:background .15s}
.gb+.gb{border-left:1px solid var(--line)}
.gb:first-child{border-radius:9px 0 0 9px}.gb:last-child{border-radius:0 9px 9px 0}
.gb:hover{background:var(--soft)}.gb:disabled{opacity:.45;cursor:not-allowed;background:none}
.gb.danger{color:#B42F2B}.gb.danger:hover{background:#FFF3F2}
.sdot{display:none;position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--H);border:2px solid #fff;box-sizing:content-box}
.sdot[data-state=dirty]{display:block}
.gb:has(.sdot[data-state=dirty]){background:#FFFBEF}
@media(max-width:940px){.gb{padding:0 11px}}
.btn.icon{width:38px;padding:0}
details.more>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}details.more>summary::-webkit-details-marker{display:none}details.more>summary:after{content:'▾';transition:transform .2s}details.more[open]>summary:after{transform:rotate(180deg)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;flex:1}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,42,68,.3)}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.acts{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s;list-style:none}
.btn:hover{background:var(--soft);border-color:#CBD2DF}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--priD)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:38px;padding:0}
.btn.danger{color:#AA312D;border-color:#F0D5D3}.btn.danger:hover{background:#FFF3F2;border-color:#DD9A96}
.save-state{font-size:12px;white-space:nowrap;color:var(--mute);max-width:165px;overflow:hidden;text-overflow:ellipsis}
.top .acts{flex-wrap:wrap}
@media(max-width:950px){.save-state{display:none}}
details.menu{position:relative}details.menu>summary::-webkit-details-marker{display:none}
.mlist{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;min-width:230px;z-index:30}
.mlist button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:10px;border-radius:8px;text-align:left;font-size:14px}
.mlist button:hover{background:var(--soft)}.mlist button:disabled{opacity:.4}
main{max-width:1380px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px}
.filters label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.filters .sp{flex:1}
select,.nm,.nt,#q{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
select:hover,.nm:hover,.nt:hover{border-color:#CBD2DF}
.badge{background:var(--priL);color:var(--priD);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:600}
.hint{color:var(--mute);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mute);transition:all .12s}
.chip:hover{border-color:#B9C4DA}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip small{opacity:.7;margin-right:5px;font-size:11px}
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s;box-shadow:-14px 0 40px rgba(16,24,40,.16);display:flex;flex-direction:column}.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.dh b{font-size:16px}
.dtabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);overflow:auto}
.dtabs button{border:0;background:none;border-radius:9px;padding:7px 13px;font-weight:500;font-size:14px;color:var(--mute);white-space:nowrap}
.dtabs button.act{background:var(--pri);color:#fff}
.dbody{overflow:auto;padding:6px 14px 24px;flex:1}.dbody .chips{margin-top:8px}
.course-check{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.course-check:hover{background:var(--soft)}.course-check input{margin-top:4px;accent-color:var(--pri);width:16px;height:16px}
.wk{font-size:11.5px;background:#EEF1F6;border-radius:6px;padding:1px 7px;color:var(--mute);white-space:nowrap;font-weight:500}
.kind{font-size:12px;color:var(--mute)}
.drop{margin:40px auto;max-width:560px;border:2px dashed #B9C4DA;border-radius:22px;padding:48px 24px;text-align:center;background:#fff;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--priL)}
.drop .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--priL);color:var(--pri);display:grid;place-items:center}
.drop b{font-size:19px;font-weight:700;display:block}.drop p{margin:4px 0 0;color:var(--mute);font-size:14px}.drop .btn{margin-top:18px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.layout.gridv{grid-template-columns:minmax(0,1fr)}.layout.gridv aside{display:none}
aside{position:sticky;top:76px;margin:0;overflow:hidden}
.lh{padding:12px;border-bottom:1px solid var(--line)}#q{width:100%}
#stat{display:block;margin-top:8px;font-size:12.5px;color:var(--mute)}
#sl{position:relative;max-height:calc(100vh - 280px);min-height:120px;overflow:auto;padding:6px}
.si{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:8px 9px;border-radius:10px}
.si:hover{background:var(--soft)}.si.on{background:var(--priL)}
.no{width:22px;font-size:12px;color:var(--mute);text-align:right;flex:none}
.sn{flex:1;min-width:0;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sn em{color:var(--mute);font-weight:400}
.dts{display:flex;gap:2px;flex:none}.dt{width:6px;height:6px;border-radius:50%;background:#D5DBE6}
.dt.T{background:var(--T)}.dt.H,.dt.D{background:var(--H)}.dt.C{background:var(--C)}
.lf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--soft)}.lf .btn{flex:1;padding:0 8px;font-size:13px}
.tabs{display:inline-flex;gap:3px;background:#E7EBF3;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;border-radius:9px;padding:6px 16px;font-weight:500;font-size:14px;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.who{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:13px;background:var(--priL);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.wf{display:flex;gap:8px;flex:1;min-width:220px;flex-wrap:wrap}
.nm{flex:1 1 180px;font-weight:600;font-size:16px;height:42px}.nt{flex:1 1 150px;height:42px;font-size:14px}
.wa{display:flex;gap:4px}
.ico{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--mute)}
.ico:hover{background:var(--soft);color:var(--ink)}.ico.del:hover{color:var(--C);border-color:#F3C2C4}
.notes{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.note-choice{border:1px dashed #C7CEDB;background:#fff;border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--mute)}
.note-choice:hover{border-color:var(--pri);color:var(--ink)}.note-choice.on{background:var(--priL);border:1px solid var(--pri);color:var(--pri);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.two .right{position:sticky;top:76px}
.card>h2,.fh h2{margin:0;padding:14px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.row{padding:12px 16px;border-top:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.rt{font-weight:600;font-size:14.5px;min-width:118px}
.acts2{margin-left:auto;display:flex;align-items:center;gap:2px}
.rc{margin:8px 0 0;font-size:14px;line-height:1.6;color:#2B3650}.ph{color:#9AA3B5;font-style:italic}
.pill{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 6px 2px 11px;font-size:12.5px;color:var(--mute)}
.pill:hover{border-color:#B9C4DA;color:var(--ink)}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--mute)}
.ib:hover{background:var(--soft);color:var(--ink)}
.dotsaved{width:7px;height:7px;border-radius:50%;background:var(--H);margin-right:4px}
.ed textarea{display:block;width:100%;margin-top:8px;border:1px solid var(--pri);border-radius:10px;padding:8px 10px;line-height:1.55;resize:vertical}
.eda{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.seg{display:inline-flex;gap:3px;background:#EEF1F6;border-radius:11px;padding:3px}
.lvb{min-width:38px;height:32px;border:0;background:none;border-radius:8px;font-weight:700;font-size:14px;color:var(--mute);transition:all .12s}
.lvb:hover{background:#fff;color:var(--ink)}.lvb[aria-pressed=true]{color:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2)}
.lvb.T[aria-pressed=true]{background:var(--T)}.lvb.H[aria-pressed=true],.lvb.D[aria-pressed=true]{background:var(--H)}.lvb.C[aria-pressed=true]{background:var(--C)}
.lvb.inherited-choice[aria-pressed=true]{opacity:.5;box-shadow:none}
.seg.sm{padding:2px}.seg.sm .lvb{min-width:30px;height:28px;font-size:12.5px}
.lnk{border:0;background:none;padding:0;color:var(--pri);font-size:13px;font-weight:500;text-align:left}.lnk:hover{text-decoration:underline}
.skill-lesson{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.skill-head{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-weight:600;font-size:13.5px;background:var(--soft)}
.course-progress{font-weight:500;font-size:12px;color:var(--mute);white-space:nowrap}.course-progress.completed{color:var(--T)}
.skill-one{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.skill-one p{margin:0;font-size:13.5px;line-height:1.45}.skill-origin{font-size:11.5px;color:var(--mute)}.manual-grade{color:var(--priD);font-weight:600}.mini-st{display:none}
.bulk-course{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.bulk-grade{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-weight:600;font-size:12.5px}.bulk-grade:hover{background:var(--soft)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:10px}
.fh>div{display:flex;gap:2px;align-items:center}
.tag{font-size:11px;font-weight:600;background:#FFF1CC;color:#8A5B00;border-radius:99px;padding:2px 9px;margin-left:8px;letter-spacing:0;text-transform:none;vertical-align:1px}
.card:not(.edited) .ifman{display:none}
.cm{display:block;width:calc(100% - 32px);margin:2px 16px 16px;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.65;resize:vertical;background:#fff}
.cm.man{border-color:var(--H);background:#FFFCF2}
.gw{overflow:auto}.gw table{border-collapse:collapse;width:100%;min-width:1000px}
.gw th{padding:10px 6px;font-size:12.5px;font-weight:600;color:var(--mute);background:var(--soft);border-bottom:1px solid var(--line);position:sticky;top:0}
.gw td{padding:6px;border-bottom:1px solid var(--line);text-align:center}.gw .l{text-align:left;padding-left:12px}
.pad{padding:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}.two .right{position:static}}
@media(max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}aside{position:static}#sl{max-height:220px}.top{padding:10px 14px}main{padding:12px 12px 50px}.acts .lbl{display:none}h1{font-size:16px;white-space:nowrap}.brand{min-width:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo" data-ic="logo" data-s="21" aria-hidden="true"></div><h1>Nhận xét lớp 1</h1></div>
 <div class="acts">
  <div class="grp" role="group" aria-label="Dữ liệu">
   <button class="gb" id="bTpl" type="button" title="Tải file Excel mẫu"><span data-ic="sheet" data-s="17"></span><span class="lbl">Mẫu</span></button>
   <button class="gb" id="bSave" type="button" title="Lưu vào trình duyệt này"><span data-ic="save" data-s="17"></span><span class="lbl">Lưu</span><i class="sdot" id="saveStatus" data-state="none"></i></button>
   <button class="gb danger" id="bClear" type="button" title="Xóa danh sách và dữ liệu đã lưu"><span data-ic="trash" data-s="17"></span><span class="lbl">Xóa dữ liệu</span></button>
  </div>
  <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
  <details class="menu" id="xm">
    <summary class="btn pri" title="Chọn phiên bản Excel để xuất" aria-label="Xuất Excel, chọn phiên bản"><span data-ic="download" data-s="17"></span><span class="lbl">Xuất Excel</span></summary>
    <div class="mlist">
      <button id="bEx1" type="button" disabled title="Mỗi môn một sheet theo mẫu, không có mã học sinh và mã nhận xét"><span data-ic="sheet" data-s="17"></span>Phiên bản 1</button>
      <button id="bEx2" type="button" disabled title="Bảng tổng hợp đầy đủ các môn, năng lực, phẩm chất và ghi chú"><span data-ic="sheet" data-s="17"></span>Phiên bản 2</button>
    </div>
  </details>
 </div>
</header>
<main>
 <div class="card filters">
  <label>Tuần <select id="w1"></select></label>
  <label>đến <select id="w2"></select></label>
  <label>Chính tả <select id="per"><option value="a">từ ngữ</option><option value="b">đoạn văn, thơ</option></select></label>
   <label title="Áp dụng cho cột Thời điểm đánh giá của Excel phiên bản 1">Thời điểm <select id="evalPeriod" aria-label="Thời điểm đánh giá khi xuất Excel phiên bản 1"><option value="GK1">GK1</option><option value="CK1">CK1</option><option value="GK2">GK2</option><option value="CK2">CK2</option></select></label>
  <span class="sp"></span>
  <button class="btn" id="bCfg" type="button"><span data-ic="sliders" data-s="17"></span>Chọn bài <span class="badge" id="cfgSum"></span></button>
 </div>

 <section id="empty" class="drop" tabindex="0" role="button" aria-label="Nạp file Excel">
  <div class="ic" data-ic="cloud" data-s="30" aria-hidden="true"></div>
  <b>Thả file Excel vào đây</b><p>hoặc bấm để chọn file</p>
  <button class="btn" id="bAdd0" type="button">Nhập thủ công</button>
 </section>

 <div id="app" class="layout" hidden>
  <aside class="card">
   <div class="lh"><input id="q" type="search" placeholder="Tìm học sinh" aria-label="Tìm học sinh"><span id="stat"></span></div>
   <div id="sl"></div>
   <div class="lf"><button class="btn" id="bAdd" type="button"><span data-ic="plus" data-s="16"></span>Thêm</button><button class="btn" id="bRe" type="button" title="Đổi cách diễn đạt cả lớp"><span data-ic="rotate" data-s="16"></span>Đổi câu</button></div>
  </aside>
  <section>
   <div class="tabs" role="tablist"><button data-view="one" class="on">Từng em</button><button data-view="grid">Bảng nhanh</button></div>
   <div id="ws"></div>
  </section>
 </div>
</main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Chọn bài">
 <div class="dh"><b>Bài đã học</b><button class="ico" id="dClose" aria-label="Đóng"><span data-ic="x" data-s="18"></span></button></div>
 <div class="dtabs" id="courseCfgTabs"><button class="act" data-pane="toan">Toán</button><button data-pane="tnxh" data-cfg-course="tnxh">TN&amp;XH</button><button data-pane="daoduc" data-cfg-course="daoduc">Đạo đức</button><button data-pane="hdtn" data-cfg-course="hdtn">HĐTN</button></div>
 <div class="dbody"><div class="chips" id="chips"></div><div id="courseCfgList" hidden></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>/*!

/* Tên bài theo PPCT trường; phần luyện tập chỉ ôn các kỹ năng đã học ở thời điểm đó.
   SGK Bài 2 có cả số 10 nhưng tên bài trên PPCT hiện ghi 6,7,8,9: nhận xét
   không tự mặc định học sinh đã học thêm số 10. */
function mathLessonSkillIds(name,week){
 const t=name.toLowerCase();
 if(t.includes('luyện tập chung')||t.includes('ôn tập chung')){
   if(week<=7)return ['digits05','digits69','quantity','compare','split'];
   if(week===9)return ['shapes','assemble'];
   if(week<=15)return ['add10','sub10','tables10'];
   if(week===17)return ['blocks','position'];
   if(week===18)return ['digits05','digits69','compare','split','add10','sub10','shapes'];
   if(week===22)return ['twodigit','compare2','chart100'];
   if(week===25)return ['lengthcmp','measure','estimate'];
   if(week<=30)return ['add21','sub21'];
   if(week===32)return ['clock','weekdays','calendar'];
   return []; // Không tự đoán nội dung của bài luyện tập không xác định.
 }
 if(t.includes('các số 0,1,2,3,4,5'))return ['digits05'];
 if(t.includes('các số 6,7,8,9'))return ['digits69'];
 if(t.includes('nhiều hơn, ít hơn'))return ['quantity'];
 if(t.includes('so sánh số có hai'))return ['compare2'];
 if(t.includes('so sánh số'))return ['compare'];
 if(t.includes('mấy và mấy'))return ['split'];
 if(t.includes('hình vuông, hình tròn'))return ['shapes'];
 if(t.includes('lắp ghép'))return ['assemble'];
 if(t.includes('khối lập phương'))return ['blocks'];
 if(t.includes('vị trí định hướng'))return ['position'];
 if(t.includes('bảng cộng'))return ['tables10'];
 if(t.includes('phép cộng số có hai'))return ['add21'];
 if(t.includes('phép trừ số có hai'))return ['sub21'];
 if(t.includes('phép cộng trong phạm vi 10'))return ['add10'];
 if(t.includes('phép trừ trong phạm vi 10'))return ['sub10'];
 if(t.includes('số có hai chữ số'))return ['twodigit'];
 if(t.includes('bảng các số từ 1'))return ['chart100'];
 if(t.includes('dài hơn, ngắn hơn'))return ['lengthcmp'];
 if(t.includes('đơn vị đo độ dài'))return ['measure'];
 if(t.includes('ước lượng và đo độ dài'))return ['estimate'];
 if(t.includes('xem giờ đúng'))return ['clock'];
 if(t.includes('các ngày trong tuần'))return ['weekdays'];
 if(t.includes('thực hành xem lịch'))return ['calendar'];
 if(t.includes('ôn tập các số trong phạm vi 10'))return ['digits05','digits69','compare','split'];
 if(t.includes('ôn tập phép cộng, phép trừ trong phạm vi 10'))return ['add10','sub10','tables10'];
 if(t.includes('ôn tập các số và phép tính trong phạm vi 10'))return ['digits05','digits69','compare','add10','sub10'];
 if(t.includes('ôn tập hình học và đo lường'))return ['shapes','blocks','lengthcmp','measure'];
 if(t.includes('ôn tập hình học'))return ['shapes','assemble','blocks'];
 return [];
}

function mathPracticeTopics(codes){
 const result=[],seen=new Set(),has=k=>codes.includes(k);
 for(const k of codes){
  if(seen.has(k))continue;
  const pair=(other,phrase)=>{
   if(!has(other))return false;
   seen.add(k);seen.add(other);result.push(phrase);return true;
  };
  if((k==='digits05'&&pair('digits69','đếm, đọc và viết các số từ 0 đến 9'))||
     (k==='digits69'&&pair('digits05','đếm, đọc và viết các số từ 0 đến 9'))||
     (k==='add10'&&pair('sub10','thực hiện phép cộng và phép trừ trong phạm vi 10'))||
     (k==='sub10'&&pair('add10','thực hiện phép cộng và phép trừ trong phạm vi 10'))||
     (k==='shapes'&&pair('assemble','nhận dạng các hình đã học và lắp ghép, xếp hình theo mẫu'))||
     (k==='assemble'&&pair('shapes','nhận dạng các hình đã học và lắp ghép, xếp hình theo mẫu')))continue;
  seen.add(k);
  if(MATH_PRACTICE[k])result.push(MATH_PRACTICE[k]);
 }
 return result;
}
/* Bài Luyện tập chung/Ôn tập chung có kiến thức đã được ánh xạ theo TUẦN.
   Chỉ nhận những kĩ năng thực sự nằm trong phạm vi bài đã chọn. */
function mathWeakCodesFrom(entries,permittedCodes){
 const allowed=new Set(permittedCodes),result=[];
 for(const [week,name] of entries){
  for(const code of mathLessonSkillIds(name,week)){
   if(allowed.has(code)&&!result.includes(code))result.push(code);
  }
 }
 return result;
}
/* Tạo lời nhận xét tự nhiên, lấy ĐÚNG từng kĩ năng giáo viên đánh dấu cần rèn.
   Không chèn nhãn “các nội dung:” và không cắt bỏ kĩ năng khi có từ 3 bài trở lên.
   Từ 4 nhóm kĩ năng trở lên: tự chia thành 2 câu để học sinh/phụ huynh dễ đọc. */
function mathSpecificWeakFeedback(level,variation,codes,weakEntries){
 const actions=mathPracticeTopics(codes);
 if(!actions.length){
  // Không gán một nội dung học tập không được suy ra từ tên bài.
  const lessons=[...new Set(weakEntries.map(([,name])=>name))];
  const names=joinMathWords(lessons);
  return level==='C'
   ?'Em cần được hướng dẫn và luyện tập thêm ở '+(lessons.length===1?'bài ':'các bài ')+names+'.'
   :'Em cần ôn luyện thêm kiến thức ở '+(lessons.length===1?'bài ':'các bài ')+names+' để làm bài chắc chắn hơn.';
 }
 const v=variation%4;
 // Ghép những cụm mang động từ, không dùng “luyện thêm cách + thực hiện ...”.
 if(actions.length<=3){
  const things=joinMathWords(actions);
  if(level==='C')return [
   'Em cần luyện tập thêm để '+things+' chính xác hơn.',
   'Em còn lúng túng khi '+things+'; cần tiếp tục luyện tập.',
   'Em cần ôn lại kiến thức và luyện tập thêm để '+things+' tốt hơn.',
   'Em cần được hướng dẫn thêm và thường xuyên thực hành để '+things+' đúng hơn.'
  ][v];
  return [
   'Em đã thực hiện được yêu cầu cơ bản nhưng đôi lúc còn nhầm lẫn khi '+things+'.',
   'Em cần luyện tập thêm để '+things+' chính xác hơn.',
   'Em đôi lúc còn lúng túng khi '+things+'; cần thực hành thêm để vững hơn.',
   'Em nắm được yêu cầu cơ bản nhưng cần luyện thêm để '+things+' thành thạo hơn.'
  ][v];
 }
 // Không biến câu văn thành một chuỗi liệt kê dài khó đọc.
 const middle=Math.ceil(actions.length/2);
 const first=joinMathWords(actions.slice(0,middle));
 const second=joinMathWords(actions.slice(middle));
 if(level==='C')return [

    }
    return false;
  };
  if(k==='digits05'&&pair('digits69','nhận biết các chữ số','nhận biết và ghi nhớ các chữ số tốt'))continue;
  if(k==='digits69'&&pair('digits05','nhận biết các chữ số','nhận biết và ghi nhớ các chữ số tốt'))continue;
  if(k==='add10'&&pair('sub10','cộng, trừ trong phạm vi 10','thực hiện phép cộng, trừ trong phạm vi 10 chính xác'))continue;
  if(k==='sub10'&&pair('add10','cộng, trừ trong phạm vi 10','thực hiện phép cộng, trừ trong phạm vi 10 chính xác'))continue;
  if(k==='add21'&&pair('sub21','thực hiện phép cộng và phép trừ với các số đã học','thực hiện đúng phép cộng và phép trừ với các số đã học'))continue;

/* -------- BA MÔN THEO PPCT: bài và kĩ năng được lựa chọn có minh chứng -------- */
function courseWithin(k){let a=+$('w1').value,b=+$('w2').value;return NEW_PPCT[k].filter(x=>x.weeks.some(w=>w>=a&&w<=b))}
function availableLessons(k){return courseWithin(k).filter(x=>courseActive[k].has(x.id))}
function getCourseLesson(k,id){return NEW_PPCT[k].find(x=>x.id===id)}
function gradeFor(s,k,id,si){return (s.courseSkill[k]||{})[id+'::'+si]||''}
// Mức môn làm mặc định cho mọi kĩ năng thuộc các bài đã chọn.
// Giáo viên có thể chấm riêng bất kỳ kĩ năng nào để thay mức mặc định đó.
function effectiveGrade(s,k,id,si){return gradeFor(s,k,id,si)||s.lv[k]||''}

// Từng kĩ năng được đối chiếu khi gộp, nhóm bài chỉ gộp nếu mức đánh giá giống nhau.
// Không tự điền T cho một kĩ năng chưa có minh chứng quan sát.
function joinSkillText(items){
 const words=items.map(x=>String(x).trim().replace(/[.;,\s]+$/g,'' )).filter(Boolean);
 if(!words.length)return '';
 if(words.length===1)return words[0];
 if(words.length===2)return words.join(' và ');
 return words.slice(0,-1).join(', ')+' và '+words[words.length-1];
}
function courseCoverage(s,k){
 const lessons=availableLessons(k),total=lessons.reduce((n,l)=>n+l.skills.length,0);
 let assessed=0,explicit=0,assessedLessons=0;
 for(const lesson of lessons){
  let any=false;
  for(let i=0;i<lesson.skills.length;i++){
   if(gradeFor(s,k,lesson.id,i))explicit++;
   if(effectiveGrade(s,k,lesson.id,i)){assessed++;any=true;}
  }
  if(any)assessedLessons++;
 }
 return {total,assessed,explicit,inherited:Math.max(0,assessed-explicit),missing:total-assessed,lessons:lessons.length,assessedLessons};
}

/* Câu theo từng kĩ năng: T = tốt, H = đã làm được nhưng chưa ổn định,
   C = chưa thực hiện được / chưa thực hiện tốt, cần rèn thêm.
   Những động từ và đối tượng đều xuất phát từ mục kĩ năng của bài PPCT. */
function skillSentence(skill,level,variant=0){
 const name=String(skill.name||'').replace(/[.;,\s]+$/g,'').trim();
 if(!name||!['T','H','C'].includes(level))return '';
 // Dạng “nêu được cách...”, “nhận biết được...”, “kể tên được...”
 const match=name.match(/^(.+?)\s+được\s+(.+)$/i);
 const goodAdv=verb=>{
   if(/^(nêu|kể|kể tên|nhắc lại|chỉ)/i.test(verb))return variant%2?'rõ':'đúng';
   if(/^(giới thiệu|chia sẻ|mô tả)/i.test(verb))return variant%2?'đầy đủ':'rõ';
   if(/^(nhận biết|phân biệt|xác định)/i.test(verb))return variant%2?'chính xác':'đúng';
   return variant%2?'thành thạo':'tốt';
 };
 if(match){
  const verb=match[1],object=match[2];
  if(level==='T')return `Em ${verb} ${goodAdv(verb)} ${object}.`;
  if(level==='H'){
   const issue=/^(giới thiệu|mô tả|chia sẻ|kể )/i.test(verb)?'diễn đạt chưa rõ':/^(thực hiện|tham gia)/i.test(verb)?'còn lúng túng':'chưa chính xác';
   return `Em ${verb} được ${object} nhưng đôi lúc ${issue}.`;
  }
  return variant%2
   ?`Em còn gặp khó khăn khi ${verb} ${object}; em cần được hướng dẫn thêm.`
   :`Em chưa ${verb} được ${object}; em cần luyện thêm.`;
 }
 // Dạng “biết rửa tay...”, “biết lắng nghe...”, “biết cách sử dụng...”
 if(/^biết\s+/i.test(name)){
  const action=name.replace(/^biết\s+/i,'');
  const knowledge=/^(cách\s+|một\s+số\s+|những\s+|các\s+)/i.test(action);
  const cognitive=/^(nêu|kể|giới thiệu|nhận biết|phân biệt|mô tả|xác định|chỉ)/i.test(action);
  if(level==='T'){
   if(knowledge)return `Em nắm vững ${action}.`;
   if(cognitive)return `Em thực hiện tốt việc ${action}.`;
   return variant%2?`Em biết ${action} và thực hiện tốt.`:`Em thực hiện tốt việc ${action}.`;
  }
  if(level==='H')return knowledge
   ?`Em đã biết ${action} nhưng đôi lúc vận dụng chưa tốt.`
   :cognitive?`Em biết ${action} nhưng đôi lúc chưa chính xác.`
   :`Em biết ${action} nhưng đôi lúc chưa thực hiện tốt.`;
  return knowledge
   ?`Em chưa nắm vững ${action}; em cần luyện thêm.`
   :cognitive?`Em còn lúng túng khi ${action}; em cần được hướng dẫn thêm.`
   :variant%2?`Em chưa làm tốt việc ${action}; em cần rèn thêm.`
    :`Em chưa thực hiện tốt việc ${action}; em cần luyện thêm.`;
 }
 // Những cách diễn đạt ít gặp trong PPCT.
 if(level==='T')return `Em thực hiện tốt kĩ năng ${name}.`;
 if(level==='H')return `Em đã thực hiện được kĩ năng ${name} nhưng đôi lúc chưa tốt.`;
 return `Em chưa thực hiện tốt kĩ năng ${name}; em cần luyện thêm.`;
}

const COURSE_BROAD={

};
function courseTopic(k,lesson){
 const n=lesson.week;
 const row=COURSE_TOPICS[k].find(([end])=>n<=end);
 return row?row[1]:COURSE_BROAD[k];
}
function courseAction(skill){
 // Giữ đúng đối tượng và động từ của từng kĩ năng, chỉ rút gọn phần mở đầu.
 let a=String(skill.name||'').trim().replace(/[.;,\s]+$/g,'');
 a=a.replace(/^biết\s+cách\s+/i,'').replace(/^biết\s+/i,'')
    .replace(/\s+được\s+/gi,' ');
 return a;
}
function courseJoin(words){
 const a=[...new Set(words.filter(Boolean).map(x=>x.trim()))];
 if(a.length===0)return '';
 if(a.length===1)return a[0];
 if(a.length===2)return a.join(' và ');
 return a.slice(0,-1).join(', ')+' và '+a[a.length-1];
}
function courseCondense(s,k,items,all){
 if(!items.length)return '';
 const overlap = items.some(x=>all.some(y=>y.grade!==x.grade && y.topic===x.topic));
 const groups = [...new Set(items.map(x=>x.topic))];
 // 1–2 kĩ năng: nêu đúng kĩ năng thực tế, không dùng chủ đề quá chung.
 if(items.length<=2)return courseJoin(items.map(x=>courseAction(x.skill)));
 // Khi một chủ đề có cả điểm tốt và kĩ năng yếu, tránh ghi cả chủ đề là "tốt".
 if(overlap && items[0].grade==='T')
  return courseJoin(items.slice(0,2).map(x=>courseAction(x.skill)));
 if(groups.length>3)return COURSE_BROAD[k];
 // Một số kĩ năng được gộp theo lĩnh vực để câu ngắn, không liệt kê 10–20 mệnh đề.
 return courseJoin(groups);
}
/* Ghi RÕ kĩ năng còn chưa ổn định theo H: không viết chung "đôi lúc chưa tốt".
   Chỉ dùng kĩ năng đã chấm H; ưu tiên kĩ năng giáo viên đánh giá riêng. */
function courseHProblem(skill){
 const raw=String(skill?.name||'').replace(/[.;,\s]+$/g,'').trim();
 const patterns=[
  [/^chỉ\s+và\s+gọi\s+tên\s+được\s+(.+)$/i,m=>`còn nhầm khi chỉ và gọi tên ${m[1]}`],
  [/^kể\s+tên\s+được\s+(.+)$/i,m=>`chưa kể đầy đủ ${m[1]}`],
  [/^kể\s+được\s+(.+)$/i,m=>`chưa kể đầy đủ ${m[1]}`],
  [/^nêu\s+được\s+(.+)$/i,m=>`chưa nêu đầy đủ ${m[1]}`],
  [/^giới\s+thiệu\s+được\s+(.+)$/i,m=>`chưa giới thiệu rõ ${m[1]}`],
  [/^mô\s+tả\s+được\s+(.+)$/i,m=>`chưa mô tả rõ ${m[1]}`],
  [/^nhận\s+biết\s+được\s+(.+)$/i,m=>`còn nhầm lẫn khi nhận biết ${m[1]}`],
  [/^phân\s+biệt\s+được\s+(.+)$/i,m=>`còn nhầm lẫn khi phân biệt ${m[1]}`],
  [/^xác\s+định\s+được\s+(.+)$/i,m=>`còn lúng túng khi xác định ${m[1]}`],
  [/^thực\s+hiện\s+được\s+(.+)$/i,m=>`chưa thực hiện tốt ${m[1]}`],
  [/^tham\s+gia\s+được\s+(.+)$/i,m=>`chưa chủ động tham gia ${m[1]}`],
  [/^biết\s+cách\s+(.+)$/i,m=>`còn lúng túng khi ${m[1]}`],
  [/^biết\s+(nêu|kể|mô tả|giới thiệu|nhận biết|phân biệt)\s+(.+)$/i,m=>`chưa ${m[1]} rõ ${m[2]}`],
  [/^biết\s+(.+)$/i,m=>`chưa thực hiện tốt việc ${m[1]}`],
 ];
 for(const [re,fn] of patterns){const match=raw.match(re);if(match)return fn(match)}
 return `còn lúng túng khi ${courseAction(skill)}`;
}
function courseHDetails(s,k,rated){
 const hs=rated.filter(x=>x.grade==='H');
 if(!hs.length)return '';
 // Những mức H giáo viên sửa riêng cần được ưu tiên hơn H mặc định của cả môn.
 const priority=[...hs].sort((a,b)=>Number(Boolean(gradeFor(s,k,b.lesson.id,b.index)))-Number(Boolean(gradeFor(s,k,a.lesson.id,a.index))));
 const selected=priority.slice(0,hs.length<=2?2:1);
 return courseJoin(selected.map(x=>courseHProblem(x.skill)));
}

function courseRatings(s,k){
 const lessons=availableLessons(k);
 const rows=[];
 for(const lesson of lessons)for(let index=0;index<lesson.skills.length;index++){
  const grade=effectiveGrade(s,k,lesson.id,index);
  if(['T','H','C'].includes(grade))rows.push({grade,lesson,index,skill:lesson.skills[index],key:lesson.id+'::'+index});
 }
 return rows;
}
function buildCompleteCourseSummary(s,k,variant=0){
 const entries=courseRatings(s,k),used=new Set(),texts={T:[],H:[],C:[]},trace=[];
 const available=new Set(availableLessons(k).map(x=>x.id));
 const byLesson=new Map();
 entries.forEach(x=>{if(!byLesson.has(x.lesson.id))byLesson.set(x.lesson.id,[]);byLesson.get(x.lesson.id).push(x)});
 const record=(grade,text,list,kind)=>{
  texts[grade].push(text);
  list.forEach(x=>{if(used.has(x.key))throw new Error('Kĩ năng đã bị tính hai lần: '+x.key);used.add(x.key)});
  trace.push({grade,kind,text,lessonIds:[...new Set(list.map(x=>x.lesson.id))],skills:list.map(x=>x.key)});
 };
 for(const bundle of COURSE_COMPLETE_BUNDLES[k]||[]){
  if(!bundle.ids.every(id=>available.has(id)))continue;
  let list=[];
  for(const id of bundle.ids){
   const lesson=getCourseLesson(k,id),rated=byLesson.get(id)||[];
   if(!lesson||rated.length!==lesson.skills.length){list=[];break}
   list.push(...rated);
  }
  if(!list.length)continue;
  const grades=[...new Set(list.map(x=>x.grade))];
  if(grades.length===1)record(grades[0],bundle.text,list,'chủ đề');
 }
 for(const lesson of availableLessons(k)){
  const list=(byLesson.get(lesson.id)||[]).filter(x=>!used.has(x.key));
  if(!list.length)continue;
  // Không bao giờ tóm tắt cả bài ở một mức nếu trong bài còn kĩ năng mức khác.
  const grades=[...new Set(list.map(x=>x.grade))];
  if(list.length===lesson.skills.length&&grades.length===1){
   let summary=COURSE_LESSON_PHRASE[k]?.[lesson.id];
   if(!summary){
    if(lesson.type==='Sinh hoạt dưới cờ')summary='tham gia sinh hoạt dưới cờ và thực hiện quy định tập thể';
    else if(/sinh hoạt lớp|sinh hoạt sao/i.test(lesson.type||lesson.name))summary='chia sẻ, lắng nghe trong sinh hoạt lớp hoặc Sao';
    else summary=courseJoin(list.map(x=>courseSkillCompact(x.skill)));
   }
   record(grades[0],summary,list,'bài');
  } else{
   list.forEach(x=>record(x.grade,courseSkillCompact(x.skill),[x],'kĩ năng'));
  }
 }
 if(used.size!==entries.length)throw new Error('Không tính đủ các kĩ năng đã đánh giá: '+used.size+'/'+entries.length);
 // Giữ đủ kĩ năng trong trace; chỉ khử cụm từ trùng nhau khi hiển thị.
 const clean=g=>[...new Set(texts[g].map(x=>x.trim()).filter(Boolean))];
 const connect=arr=>arr.length===0?'':arr.length===1?arr[0]:arr.slice(0,-1).join(', ')+', đồng thời '+arr[arr.length-1];
 const good=connect(clean('T'));
 const fair=connect(clean('H'));
 const weak=connect(clean('C'));
 // Mẫu câu đa dạng, nhưng luôn đưa nguyên vẹn nhóm nội dung T/H/C vào câu.
 // Các mẫu H/C đều nói rõ nội dung còn hạn chế; tuyệt đối không dừng ở "đôi lúc chưa tốt".
 const sentence=courseNaturalSentence(k,trace,variant);
 return {sentence,evaluated:entries.length,count:used.size,lessons:byLesson.size,trace};
}

function courseChoice(arr,variant,index=0){
 if(!Array.isArray(arr))return String(arr||'');
 if(!arr.length)return '';
 return arr[((variant + index*5)%arr.length+arr.length)%arr.length];
}

function courseNaturalAdjust(sentence,variant){
 // Chỉ điều chỉnh cách diễn đạt, không tự thêm hành vi học sinh chưa được đánh giá.
 const mode=Math.floor(((variant%12)+12)%12/4);
 if(mode===0)return sentence;
 const edits= mode===1 ? [
  [/^Em đã biết /,'Em bước đầu biết '],
  [/^Em đã nhận biết được /,'Em bước đầu nhận biết được '],
  [/^Em biết /,'Em đã biết '],
  [/^Em nhận biết được /,'Em đã nhận biết được '],
  [/^Em cần được hướng dẫn thêm /,'Em cần được hỗ trợ thêm về '],
  [/^Em cần rèn thêm /,'Em cần luyện thêm '],
  [/^Em cần tập /,'Em cần luyện tập ']
 ] : [
  [/^Em đã biết (?=(?:giới thiệu|kể|chào|giao tiếp|sắp xếp|làm|thực hiện|giữ|tìm hiểu|bày tỏ|vui chơi|tự|tham gia|hợp tác|quan tâm|nhận biết|phân biệt|nêu|nhận ra|lựa chọn|chia sẻ|giúp|chăm sóc|phòng tránh|trả lại|xin phép|ứng xử|chuẩn bị|tuân thủ|hỏi han|lắng nghe|đọc|viết|sử dụng))/,'Em có thể '],
  [/^Em đã nhận biết được /,'Em đã nhận ra '],
  [/^Em biết (?=(?:giới thiệu|kể|chào|giao tiếp|sắp xếp|làm|thực hiện|giữ|tìm hiểu|bày tỏ|vui chơi|tự|tham gia|hợp tác|quan tâm|nhận biết|phân biệt|nêu|nhận ra|lựa chọn|chia sẻ|giúp|chăm sóc|phòng tránh|trả lại|xin phép|ứng xử|chuẩn bị|tuân thủ|hỏi han|lắng nghe|đọc|viết|sử dụng))/,'Em có thể '],
  [/^Em nhận biết được /,'Em đã nhận ra '],
  [/^Em cần được hướng dẫn thêm /,'Em cần được hỗ trợ thêm về '],
  [/^Em cần rèn thêm /,'Em cần tiếp tục rèn '],
  [/^Em cần tập /,'Em cần luyện tập ']
 ];
 for(const [pattern,replacement] of edits){if(pattern.test(sentence))return sentence.replace(pattern,replacement)}
 return sentence;
}

function courseNaturalSingle(t,level,variant,k){

 if(t.kind==='bài'&&special?.[level]){
  const alternatives=COURSE_NATURAL_SINGLE_ALTS[k]?.[t.lessonIds?.[0]]?.[level]||[];
  return courseChoice([special[level],...alternatives],variant);
 }
 const extra= t.kind==='bài' ? COURSE_NATURAL_SINGLE_ALTS[k]?.[t.lessonIds?.[0]]?.[level] : null;
 if(extra?.length && variant%3!==0)return courseChoice(extra,variant);

 const a=String(t.text||'').trim().replace(/[.!?;\s]+$/g,'').replace(/^biết\s+/i,'');
 if(!a)return '';
 if(level==='T'){
  if(/^(nhận biết|kể|giới thiệu|mô tả|phân biệt|quan sát|nêu|chỉ|xác định|tìm hiểu)/i.test(a))
   return courseChoice(['Em '+a+'.','Em đã '+a+'.'],variant);
  return courseChoice(['Em biết '+a+'.','Em đã biết '+a+'.'],variant);
 }
 if(level==='H'){

 }
 if(/^nêu cách\s+/i.test(a))return courseChoice(['Em cần được hướng dẫn thêm để nêu đúng cách '+a.replace(/^nêu cách\s+/i,'')+'.','Em cần ôn tập thêm để trình bày được cách '+a.replace(/^nêu cách\s+/i,'')+'.'],variant);

function courseNaturalSentence(k,trace,variant=0){
 if(!trace.length)return '';
 const bundles=COURSE_COMPLETE_BUNDLES[k]||[];
 const natural=COURSE_NATURAL_GROUPS[k]||[];
 const grouped={T:[],H:[],C:[]};
 for(const t of trace){
  let speech='';
  if(t.kind==='chủ đề'){
   const i=bundles.findIndex(b=>b.ids.length===t.lessonIds.length && b.ids.every(id=>t.lessonIds.includes(id)));
   if(i>=0){
    const entry=natural[i],field=t.grade==='T'?'good':t.grade==='H'?'h':'c';
    const additions=COURSE_NATURAL_ADDITIONS[k]?.[i]?.[field]||[];
    speech=courseChoice([entry?.[field]||'',...additions],variant,i);
   }
  }
  if(!speech)speech=courseNaturalSingle(t,t.grade,variant,k);
  if(speech)grouped[t.grade].push({speech,kind:t.kind,skills:t.skills,lessonIds:t.lessonIds});
 }
 const dedup=(list)=>list.filter((r,i,a)=>a.findIndex(e=>e.speech===r.speech)===i);
 // Kĩ năng chấm riêng H/C cần được ưu tiên khi lời nhận xét phải rút gọn.
 const importance=(t)=>t.kind==='kĩ năng'?3:t.kind==='bài'?2:1;
 const good=dedup(grouped.T);
 const uncertain=dedup(grouped.H).sort((a,b)=>importance(b)-importance(a));
 const needs=dedup(grouped.C).sort((a,b)=>importance(b)-importance(a));
 // Lấy ví dụ ở các chặng đầu - giữa - cuối để nhận xét cả kì, không chỉ bài đầu tiên.
 function representative(rows,max){
  if(rows.length<=max)return rows;
  if(max===1)return [rows[0]];
  if(max===2)return [rows[0],rows[rows.length-1]];
  return [rows[0],rows[Math.floor(rows.length/2)],rows[rows.length-1]];
 }
 const out=[];
 const goodCap=uncertain.length||needs.length?2:Math.min(3,good.length);
 out.push(...representative(good,goodCap).map(t=>t.kind==='chủ đề'?courseNaturalAdjust(t.speech,variant):t.speech));
 out.push(...representative(uncertain,needs.length?1:2).map(t=>t.kind==='chủ đề'?courseNaturalAdjust(t.speech,variant):t.speech));
 out.push(...representative(needs,2).map(t=>t.kind==='chủ đề'?courseNaturalAdjust(t.speech,variant):t.speech));
 if(!out.length)return '';

}
function courseFeedback(s,k,l,v){

 const ss=[],ssXml=await rd('xl/sharedStrings.xml');
 if(ssXml){const sx=parse(ssXml);for(const si of nodes(sx,'si'))ss.push(nodes(si,'t').map(t=>t.textContent).join(''));}

  }

 for(const r of nodes(sheet,'row')){
  if(r.parentNode?.localName!=='sheetData')continue;

    if(c.parentNode!==r)continue;

    if(t==='s'&&v)val=ss[+v.textContent]||'';
    else if(t==='inlineStr')val=nodes(c,'t').map(x=>x.textContent).join('');
    else if(v)val=v.textContent;
    a[colIdx(c.getAttribute('r'))]=val;
  }
  rows[+r.getAttribute('r')-1]=a;
 }
 return rows;
}
function parseStudents(rows){
  let h=-1,map={};
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=rows[i]||[],m={};
    r.forEach((c,j)=>{const t=norm(c);
      if(t.startsWith('nhan xet')){
        const tail=t.replace(/^nhan xet\s*/, '').trim();
        if((t.includes('tong hop')&&t.includes('tieng viet'))||tail==='tieng viet')m.tvSummary=j;
        else if(t.includes('tong hop')||tail==='tieng viet & toan'||tail==='tieng viet va toan')m.summary=j;
        else {const names={nghe:'nghe chinh ta',doc:'doc',toan:'toan',tnxh:'tu nhien va xa hoi',daoduc:'dao duc',hdtn:'hoat dong trai nghiem',nlc:'nang luc chung',nld:'nang luc dac thu',pc:'pham chat chu yeu'};
          const match= isWritingLabel(tail)?'viet':Object.entries(names).find(([k,n])=>tail===n)?.[0];
          if(match){if(!m.review)m.review={};m.review[match]=j;}}
        return;
      }
      if(t==='ghi chu'){m.note=j;return;}
      const qn=QUICK_NOTES.find(x=>norm(x)===t);
      if(qn){if(!m.noteFlags)m.noteFlags={};m.noteFlags[qn]=j;return;}
      if((t.includes('ho')&&t.includes('ten'))||t==='ten'||t==='ho va ten hoc sinh')m.name=j;
      else if(t.includes('nang luc chung'))m.nlc=j;
      else if(t.includes('nang luc dac thu'))m.nld=j;
      else if(t.includes('pham chat chu yeu'))m.pc=j;
      else if(t.includes('nghe'))m.nghe=j;
      else if(t==='doc'||t==='doc (t/h/c)')m.doc=j;
      else if(isWritingLabel(t))m.viet=j;
      else if(t.includes('tu nhien')&&t.includes('xa hoi'))m.tnxh=j;
      else if(t.includes('dao duc'))m.daoduc=j;
      else if(t.includes('trai nghiem')||t==='hdtn')m.hdtn=j;
      else if(t.includes('toan'))m.toan=j;
    });
    if(m.name!==undefined&&Object.keys(m).length>=3){h=i;map=m;break}
  }
  if(h<0){h=0;map={name:1,nghe:2,doc:3,viet:4,toan:5};}
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];let nm=String(r[map.name]||'').trim();if(!nm)continue;
    let note='';const m=nm.match(/\(([^)]*)\)\s*$/);
    if(m){note=m[1].trim();nm=nm.replace(/\s*\([^)]*\)\s*$/,'').trim()}
    const lv={};
    STUDY.forEach(([k])=>{const v=String(r[map[k]]||'').trim().toUpperCase();lv[k]=['T','H','C'].includes(v)?v:''});
    EXTRA.forEach(([k])=>{const v=String(r[map[k]]||'').trim().toUpperCase();lv[k]=v==='D'?'Đ':['T','Đ','C'].includes(v)?v:''});
    // Các cột lựa chọn nhanh (Có/Không) là nguồn chính khi được cung cấp;
    // cột Ghi chú tự do chỉ bổ sung các ý KHÔNG trùng với năm lựa chọn.
    const legacy=note||((map.note!==undefined)?String(r[map.note]||'').trim():'');
    let selectedNotes=[];
    if(map.noteFlags){
      selectedNotes=QUICK_NOTES.filter(label=>{
        const idx=map.noteFlags[label];if(idx===undefined)return false;
        const v=norm(r[idx]||'');
        return ['co','x','✓','✔','1','yes','true','chon'].includes(v);
      });
      const other=legacy.split(/[;,\n]+/).map(x=>x.trim()).filter(x=>x&&!QUICK_NOTES.some(q=>norm(q)===norm(x)));
      selectedNotes=[...selectedNotes,...other];
    }else if(legacy){selectedNotes=legacy.split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean);}
    const student=mk(nm,lv,[...new Set(selectedNotes)].join('; '));
    if(map.summary!==undefined){const text=String(r[map.summary]||'').trim();if(text)student.manual=text;}
    if(map.tvSummary!==undefined){const text=String(r[map.tvSummary]||'').trim();if(text)student.manualTv=text;}
    for(const [k,j] of Object.entries(map.review||{})){const text=String(r[j]||'').trim();if(text)student.custom[k]=text;}
    out.push(student);
  }
  // Lưu thông tin đối chiếu cột để cảnh báo khi thiếu tiêu đề thay vì âm thầm bỏ dữ liệu.
  Object.defineProperty(out,'columnMap',{value:map,enumerable:false});
  return out;
 }

 const z=new JSZip(),N='http://schemas.openxmlformats.org/';

 z.file('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${N}package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${N}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${N}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
 z.file('xl/styles.xml',STY);sheets.forEach((s,i)=>z.file(`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)));
 return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

const LOCAL_SAVE_KEY='nhan_xet_lop_1_tangerine_offline_v1';
let lastSavedSnapshot=null;
function storageSnapshot(){
 return {
  version:1, weeks:[+$('w1').value,+$('w2').value], period:PER, evalPeriod:$('evalPeriod').value,
  selectedTopics:[...sel], courseActive:Object.fromEntries(COURSE_KEYS.map(k=>[k,[...courseActive[k]]])),
  seed,uid,cur,view,
  students:S.map(st=>({
   id:st.id,name:st.name,note:st.note,lv:st.lv,pick:st.pick,
   focus:st.focus,weak:[...(st.weak||[])],manual:st.manual,manualTv:st.manualTv,
   courseSpin:st.courseSpin,courseSkill:st.courseSkill,custom:st.custom
  }))
 };
}
function snapshotString(){return JSON.stringify(storageSnapshot())}
function refreshSaveStatus(){
 const status=$('saveStatus');if(!status)return;
 const now=snapshotString(),unsaved=S.length&&now!==lastSavedSnapshot;
 status.dataset.state=unsaved?'dirty':lastSavedSnapshot?'saved':'none';
 {const m=unsaved?'Có thay đổi chưa lưu':lastSavedSnapshot?'Đã lưu':'Lưu vào trình duyệt này';$('bSave').title=m;$('bSave').setAttribute('aria-label','Lưu. '+m)}
 $('bSave').disabled=!S.length;
 $('bClear').disabled=!S.length&&!lastSavedSnapshot;
}
function saveToBrowser(){
 // Cũng lưu câu đang gõ trong trình sửa từng môn, kể cả chưa nhấn nút lưu nhỏ.
 const pending=$('ws').querySelector('[data-review-text]');
 if(pending){const st=find(cur);if(st){const k=pending.dataset.reviewText;const v=pending.value.trim();if(v){st.custom[k]=v;st.editing='';if(['nghe','doc','viet'].includes(k))st.manualTv=null;}}}
 if(!S.length){toast('Hãy thêm học sinh trước khi lưu');return}
 try{
  const data=snapshotString();
  localStorage.setItem(LOCAL_SAVE_KEY,data); // localStorage có giới hạn dung lượng của trình duyệt
  lastSavedSnapshot=data;
  if(pending)render();
  refreshSaveStatus();
  toast('Đã lưu '+S.length+' học sinh trên trình duyệt này');
 }catch(err){console.error('Không lưu được trên trình duyệt:',err);toast('Không lưu được: hãy xuất Excel sao lưu và kiểm tra quyền lưu của trình duyệt')}
}
function applySavedSnapshot(p){
  if(p?.version!==1||!Array.isArray(p.students))throw Error('Phiên bản dữ liệu không phù hợp');
  const a=Math.max(1,Math.min(35,+p.weeks?.[0]||1)),b=Math.max(a,Math.min(35,+p.weeks?.[1]||18));
  $('w1').value=String(a);$('w2').value=String(b);
  PER=p.period==='b'?'b':'a';$('per').value=PER;
  $('evalPeriod').value=['GK1','CK1','GK2','CK2'].includes(p.evalPeriod)?p.evalPeriod:'GK1';
  sel=new Set(Array.isArray(p.selectedTopics)?p.selectedTopics.filter(x=>typeof x==='string'):[]);
  for(const k of COURSE_KEYS){const arr=p.courseActive?.[k];const valid=new Set(courseWithin(k).map(l=>l.id));
   courseActive[k]=new Set((Array.isArray(arr)?arr:[]).filter(id=>valid.has(id)));
  }
  seed=Number.isFinite(+p.seed)?+p.seed:0;
  uid=0;
  S=p.students.filter(x=>x&&typeof x==='object').map(src=>{
   const st=mk(String(src.name||''),src.lv||{},String(src.note||''));
   if(Number.isSafeInteger(src.id)&&src.id>0)st.id=src.id;
   uid=Math.max(uid,st.id);
   st.pick=src.pick&&typeof src.pick==='object'?src.pick:{};
   st.focus=Object.assign(st.focus,src.focus||{});
   st.weak=Array.isArray(src.weak)&&src.weak.length?new Set(src.weak):null;
   st.manual=typeof src.manual==='string'?src.manual:null;
   st.manualTv=typeof src.manualTv==='string'?src.manualTv:null;
   st.courseSpin=Object.assign(st.courseSpin,src.courseSpin||{});
   st.courseSkill=Object.assign(st.courseSkill,src.courseSkill||{});
   st.custom=src.custom&&typeof src.custom==='object'?src.custom:{};
   return st;
  });
  uid=Math.max(uid,Number.isSafeInteger(p.uid)?p.uid:0);
  cur=S.some(s=>s.id===p.cur)?p.cur:(S[0]?.id||0);
  view=p.view==='grid'?'grid':'one';
  drawChips();updateCourseUI();render();
  // Chỉ nhận dữ liệu ở bộ nhớ; cần bấm Lưu để ghi vào localStorage.
}
function restoreFromBrowser(){
 let raw;
 try{raw=localStorage.getItem(LOCAL_SAVE_KEY)}catch(err){console.warn('Trình duyệt không cho truy cập dữ liệu cục bộ',err);return}
 if(!raw)return;
 try{
  applySavedSnapshot(JSON.parse(raw));
  lastSavedSnapshot=snapshotString();
  refreshSaveStatus();
  toast('Đã khôi phục '+S.length+' học sinh từ lần lưu trước');
 }catch(err){console.error('Bản lưu trình duyệt chưa đọc được',err);toast('Không khôi phục được bản lưu; dữ liệu cũ chưa bị xóa')}
}
function clearBrowserData(){
 const msg='Xóa TOÀN BỘ dữ liệu đã lưu trên trình duyệt và danh sách học sinh đang hiển thị?\\n\\nCác nhận xét chưa xuất Excel sẽ không thể khôi phục sau khi xóa.';
 if(!confirm(msg.replace(/\\n/g,'\n')))return;
 try{localStorage.removeItem(LOCAL_SAVE_KEY)}catch(err){
  console.error('Không xóa được bản lưu',err);toast('Không thể xóa bản lưu trên trình duyệt này');return;
 }
 S=[];uid=0;cur=0;view='one';q='';seed=0;lastSavedSnapshot=null;
 $('q').value='';$('w1').value='1';$('w2').value='18';$('evalPeriod').value='GK1';
 resetSel();render();refreshSaveStatus();
 toast('Đã xóa danh sách và bản lưu trên trình duyệt');
}
$('bSave').addEventListener('click',saveToBrowser);
$('bClear').addEventListener('click',clearBrowserData);
// Chỉ cập nhật trạng thái; KHÔNG tự ghi đè bản lưu khi người dùng chưa nhấn Lưu.
for(const evt of ['input','change','click'])document.addEventListener(evt,()=>queueMicrotask(refreshSaveStatus));
window.addEventListener('beforeunload',event=>{
 if(S.length&&lastSavedSnapshot!==snapshotString()){
  event.preventDefault();event.returnValue='';
 }
});

render();
restoreFromBrowser();
refreshSaveStatus();
</script>
